description: |
  iKeyMonitor commercial stalkerware IoCs (packages, C2 domains, REST/WebSocket
  fingerprints, sample APK and signing-certificate SHA-256 hashes).
  Package names are often date-stamped weekly builds (e.g. com.android.internet.aYYYYMMDD).
