title: DarkSword Ciolino behavioral indicators
id: darksword-ciolino-behavioral
status: experimental
description: |
  Post-exploitation behaviors from reconstructed DarkSword chain — WebContent framework
  load abuse, ICMPv6 kernel R/W sockets, sandbox token issuance, cross-process JS injection.
author: IsMyPhonePwned (adapted for sigma-zero)
date: 2026/03/01
logsource:
  product: ios
detection:
  selection:
    message|contains:
      - 'TextToSpeech.framework'
      - 'PerfPowerServicesReader'
      - 'ICMP6_FILTER'
      - 'IPPROTO_ICMPV6'
