title: Stalkware - Mobile Tracker Free
id: daafd55e-6429-4174-9279-6aa3c3ee064a
status: stable
description: |
  Mobile Tracker Free commercial stalkerware IoCs (payload and dropper packages,
  C2 and TURN domains, Firebase project ID, unique User-Agents, sample APK and
  signing-certificate SHA-256 hashes). Package names often include a year or
  build date (phone.monitor2026, monitor.phone062026, …).
  Cloudflare anycast IPs for tracker-free.com / mobile-tracker-free.com are
  omitted because they are shared and must not be used as standalone blocks.
author: Sebdraven https://github.com/sebdraven
date: 2026/10/20
logsource:
  product: android
  category: stalkware
level: high
