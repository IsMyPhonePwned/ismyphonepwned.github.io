title: DarkSword Ciolino C2 exfil ports
id: darksword-ciolino-exfil-ports
status: experimental
description: |
  DarkSword HTTPS/HTTP exfiltration ports (8882/8881) to known campaign infrastructure.
  Ref AntonioCiolino/DarkSword-Analysis (sqwas.shapelie.com C2).
author: IsMyPhonePwned (adapted for sigma-zero)
date: 2026/03/01
logsource:
  product: ios
  category: network
detection:
  selection_ports:
    event_type: network_socket
    remote_port:
      - '8881'
      - '8882'
  selection_local_ports:
    event_type: network_socket
    local_port:
      - '8881'
      - '8882'
  selection_domain:
    destination_domain|contains:
      - 'shapelie.com'
      - 'cdncounter.net'
  condition: (selection_ports or selection_local_ports) and selection_domain
level: critical
tags:
  - attack.command_and_control
