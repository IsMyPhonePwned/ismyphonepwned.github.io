title: Package installed outside default installer
id: mobipwn-sideload-package-install
status: experimental
description: |
  Flags Android apps in bugreport package metadata installed by a third-party package —
  not Play Store, system installer UI, or common OEM/MDM updaters. Excludes apps under /system/.
  Adapted from mobipwn/examples/mobipwn-queries/rules/mobile/sideload_package_install.yaml
author: mobipwn (adapted for sigma-zero)
date: 2026/03/01
references:
  - https://developer.android.com/reference/android/content/pm/PackageInfo#installerPackageName
logsource:
  product: android
  category: package_install
detection:
  selection_metadata:
    package_name|contains: '.'
  filter_known_installers:
    installerPackageName:
      - 'com.android.vending'
      - 'com.google.android.packageinstaller'
      - 'com.android.packageinstaller'
      - 'com.facebook.system'
      - 'com.samsung.android.app.updatecenter'
      - 'com.sec.android.app.samsungapps'
      - 'com.android.managedprovisioning'
      - 'android'
  filter_system_path:
    codePath|contains: '/system/'
  condition: selection_metadata and not filter_known_installers and not filter_system_path
falsepositives:
  - Pre-installed apps with null installer
  - OEM fleet updaters not in filter list
level: high
tags:
  - attack.persistence
  - discovery.software
