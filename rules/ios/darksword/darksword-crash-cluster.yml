title: DarkSword exploit crash cluster
id: darksword-crash-cluster
status: experimental
description: |
  Crash reports consistent with DarkSword chain stages — not isolated process names.
  High confidence: EXC_ARM_DA_ALIGN at PC 0x0000000000000201 in post-exploit injection
  targets (configd, UserEventAgent, wifid, securityd). Also mediaplaybackd kernel-stage
  EXC_ARM_DA_ALIGN and EXC_GUARD in injection targets or WebKit sandbox-escape processes.
  Ref iVerify, GTIG, AntonioCiolino/DarkSword-Analysis §5.4.
author: IsMyPhonePwned (adapted for sigma-zero)
date: 2026/03/01
logsource:
  product: ios
  category: crash
detection:
  selection_crashlogs:
    sysdiagnose_parser: crashlogs
  selection_align_sig:
    message|contains: 'EXC_ARM_DA_ALIGN'
  selection_align_pc:
    message|contains: '0x0000000000000201'
  selection_configd:
    message|contains: 'configd'
  selection_user_event:
    message|contains: 'UserEventAgent'
  selection_wifid:
    message|contains: 'wifid'
  selection_securityd:
    message|contains: 'securityd'
  selection_mpd:
    message|contains: 'mediaplaybackd'
  selection_exc_guard:
    message|contains: 'EXC_GUARD'
  selection_webkit:
    message|contains:
      - 'WebKit.WebContent'
      - 'WebKit.GPU'
  condition: selection_crashlogs and ((selection_align_sig and selection_align_pc and (selection_configd or selection_user_event or selection_wifid or selection_securityd)) or (selection_mpd and selection_align_sig) or (selection_exc_guard and (selection_configd or selection_user_event or selection_wifid or selection_securityd)) or (selection_exc_guard and selection_webkit))
level: high
tags:
  - crash
