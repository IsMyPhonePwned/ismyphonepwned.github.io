title: Stalkware - Hoverwatch / Snoopza
id: 39b25970-152e-4445-b844-e5437603f45f
status: stable
description: |
  Hoverwatch (HWA) and Snoopza (SNPA) commercial stalkerware IoCs: bootstrap C2
  domains, brand infrastructure, package names (com.android.core.mn*), enrolment
  artefact path, sample APK hashes, and attributed OVH / DigitalOcean hosts.
  Package suffixes rotate between builds (mntan, mntau, mngam, mngag, …).
author: Sebdraven https://github.com/sebdraven
date: 2026/10/20
logsource:
  product: android
  category: stalkware
level: high
