title: AmnestyTech Investigations - Cytrox Predator (2021-12-16)
id: amnesty-inv-2021-12-16-cytrox
status: experimental
description: |
  Cytrox Predator IoCs – domains, file paths, config profiles.
  Full list at https://github.com/AmnestyTech/investigations/tree/master/2021-12-16_cytrox
  Credits: Amnesty International Tech Security Lab / AmnestyTech.
  Later Predator infrastructure returns (Recorded Future / MVT PR #16) are covered in
  rules/mvt/intellexa_predator_rf_return.yml.
level: critical
author: AmnestyTech (adapted for sigma-zero)
date: 2021/12/16
modified: 2026/09/21
references:
  - https://github.com/AmnestyTech/investigations/tree/master/2021-12-16_cytrox
  - https://github.com/AmnestyTech/investigations
  - https://github.com/mvt-project/mvt-indicators/pull/16

detection:
  selection_domain:
    destination_domain:
      - '2y4nothing.xyz'
      - '5m5.io'
      - 'bit-ly.link'
      - 'bit-ly.org'
      - 'connectivitycheck.live'
      - 'connectivitycheck.online'
      - 'youtube.gr.live'
      - 'youtube.voto'
      - 'yallakora-egy.com'
      - 'instagam.photos'
      - 'shorten.fi'
      - 'shortenurls.me'
      - 'browsercheck.services'
      - 'link-protection.com'
      - 'ebill.cosmote.center'
      - 'pdfviewer.app'
  selection_path:
    file_path:
      - '/private/var/tmp/UserEventAgent'
      - '/private/var/tmp/com.apple.WebKit.Networking'
      - '/private/var/tmp/hooker'
      - '/private/var/tmp/takePhoto'
      - '/data/local/tmp/wd/fs.db'
      - '/data/local/tmp/wd/'
  condition: selection_domain or selection_path
